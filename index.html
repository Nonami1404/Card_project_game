<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project UFC</title>
    <script src="js/script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alata&family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=MuseoModerno:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/hamburgers/1.2.1/hamburgers.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="header_wrapper">
            <div class="container headerInside">
                <span class="headerTitle">FightersClub</span>
                <ul class="nav">
                    <li><a href="#start-fight-btn">Начать бой</a></li>
                    <li><a href="#fighters">Бойцы</a></li>
                </ul>
                <button class="hamburger hamburger--spin" type="button" id="burgerButton">
                    <span class="hamburger-box">
                        <span class="hamburger-inner"></span>
                    </span>
                </button>

                <ul class="nav mobile-nav" id="mobileMenu">
                    <li><a href="#start-fight-btn">Начать бой</a></li>
                    <li><a href="#fighters">Бойцы</a></li>
                </ul>
            </div>
        </div>
    </header>
    <main class="main-section">
    <section>
      <div class="fighter-card-section">
        <div class="betRadio">
          <h2>Баланс: <span id="balance"></span> монет</h2>
          <div class="label">
            <label>
              <input type="radio" name="bet" value="fighter1"> Поставить на бойца 1
            </label>
            <label>
              <input type="radio" name="bet" value="fighter2"> Поставить на бойца 2
            </label>
          </div>
        </div>
        <button class="start-fight-btn">Начать бой</button>

        <div class="fighters">
          <div class="fighter-card1">Боец 1</div>
          <span>VS</span>
          <div class="fighter-card2">Боец 2</div>
        </div>
        <div id="result"></div>
      </div>
    </section>
    <section class="recommended-section" id="fighters">
      <h2>Все бойцы</h2>
      
      <div class="recommended-cards"></div>
     
    </section>
  </main>

  <footer class="footer">
    <p>Work has been done by:</p>
    <p>Ismail, Behzod, Jqahongir, Said-Azam Front-end developers</p>
  </footer>


</body>
</html>
